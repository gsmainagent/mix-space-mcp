name: Docker

on:
  push:
    branches: [master]

env:
  IMAGE: ghcr.io/gsmainagent/mix-space-mcp

jobs:
  build:
    name: Build linux/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            # GitHub-hosted ARM runner (free for public repos); no QEMU needed.
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Per-arch artifacts get a tmp tag only; labels/annotations are applied
      # HERE — the merge job references these manifests by digest and will not
      # rewrite the child image config.
      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=tmp-${{ github.sha }}-${{ matrix.arch }}

      - name: Build and push (single arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          # Keep each tmp tag a plain single-arch manifest so imagetools can
          # merge it; also required for registries that choke on attestations.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-linux-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-linux-${{ matrix.arch }}

  publish:
    name: Publish multi-arch index
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify per-arch manifests exist
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            ref="${IMAGE}:tmp-${GITHUB_SHA}-${arch}"
            echo "::group::inspect ${ref}"
            docker buildx imagetools inspect "$ref" \
              | grep -q "Platform:[[:space:]]*linux/${arch}" \
              || { echo "::error::missing or wrong-arch manifest for ${ref}"; exit 1; }
            echo "::endgroup::"
          done

      # Final tags (latest + short sha) point at a multi-arch index referencing
      # the tmp tags by digest. Do NOT delete tmp tags afterwards: the index
      # depends on them.
      - name: Create multi-arch index
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${short_sha}" \
            "${IMAGE}:tmp-${GITHUB_SHA}-amd64" \
            "${IMAGE}:tmp-${GITHUB_SHA}-arm64"
          echo "Published ${IMAGE}:latest and ${IMAGE}:${short_sha} (linux/amd64 + linux/arm64)"
