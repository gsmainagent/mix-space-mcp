# mix-space-lts-frontend-mcp 部署编排
#
# 镜像来自 ACR（本地构建后经 owner 授权推送），名称同仓库名。
#
# 当前实际部署（2026-09-18）是等价的 `docker run` 形态：
#   docker run -d --name mix-space-lts-frontend-mcp --restart unless-stopped \
#     -p 127.0.0.1:3210:3000 -e MIXSPACE_API_URL=https://YOUR-BLOG-API \
#     registry.cn-hangzhou.aliyuncs.com/gsagent/mix-space-lts-frontend-mcp:latest
# 本文件是它的**可复现等价形式**（本地部署 + 端口）；登记见 workspace/DEPLOYMENTS.md。
#
# ⚠️ 勿与正在运行的 docker-run 容器同名冲突：先 `docker rm -f mix-space-lts-frontend-mcp`
#    再 `docker compose up -d`。
#
# 需要公网隧道时用 profile：`docker compose --profile tunnel up -d`
#   （那时去掉 app 的 ports；frps 按域名分流 ⇒ 不发布任何宿主机端口）
name: mix-space-lts-frontend-mcp

services:
  app:
    image: registry.cn-hangzhou.aliyuncs.com/gsagent/mix-space-lts-frontend-mcp:latest
    container_name: mix-space-lts-frontend-mcp
    restart: unless-stopped
    environment:
      # 工具内部硬编码 /api/v2，客户端已做端点自适应 ⇒ 裸 origin 与带路径都可
      MIXSPACE_API_URL: https://YOUR-BLOG-API
      PORT: "3000"
    ports:
      # 本地部署：仅 loopback（注意 mirrored 网络下对 Windows 同样可达，不算强隔离）
      - "127.0.0.1:3210:3000"
    networks:
      mslfm:
        aliases:
          - app                     # 必须等于 frpc.toml 里的 localIP
    healthcheck:
      # MCP 端点对普通 GET 返 406，属预期；用 TCP 可达性作健康判据
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ---- 可选：公网隧道（docker compose --profile tunnel up -d）----
  frpc:
    profiles: ["tunnel"]
    image: registry.cn-hangzhou.aliyuncs.com/arm64m/frpc:v0.70.1
    container_name: mix-space-lts-frontend-mcp-frpc
    restart: unless-stopped
    command: ["-c", "/etc/frp/frpc.toml"]
    depends_on:
      app:
        condition: service_started
    env_file:
      - ./frpc/frpc.env            # FRP_TOKEN=***（不入库）
    volumes:
      - ./frpc/frpc.toml:/etc/frp/frpc.toml:ro
    networks: [mslfm]

networks:
  mslfm:
    driver: bridge