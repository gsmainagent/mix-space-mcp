# mixspace-mcp 部署编排：应用容器 + frpc 域名隧道（不上云）
#
# 照 workspace/infra/README.md 的三处改动落地：
#   1. services.app  → mixspace-mcp 镜像（容器内端口 3000）
#   2. frpc/frpc.toml → localIP=app, localPort=3000
#   3. frpc/frpc.env  → FRP_TOKEN=<frps auth.token>
#
# 约定要点（实测结论，别改）
#  - 不发布任何宿主机端口：frps 按 customDomains 域名分流，本就不需要；
#    WSL 是 mirrored 网络，绑 loopback 对 Windows 同样可达 —— 隔离靠「不发布端口」。
#  - localIP 必须是同一 compose 网络里的服务名，不是 IP、不是宿主机端口。
#  - frpc 用公共镜像 arm64m/frpc:v0.70.1，ENTRYPOINT 无默认参数 → 显式 -c。
name: mixspace-mcp

services:
  app:
    image: mixspace-mcp:local
    build:
      context: ..
    container_name: mixspace-mcp-app
    restart: unless-stopped
    environment:
      # 工具内部硬编码 /api/v2，客户端已做端点自适应 ⇒ 裸 origin 与带路径都可
      MIXSPACE_API_URL: https://YOUR-BLOG-API
      PORT: "3000"
    networks:
      mixspace:
        aliases:
          - app                     # 必须等于 frpc.toml 里的 localIP
    healthcheck:
      # MCP 端点对普通 GET 返 406，属预期；用 TCP 可达性作健康判据
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  frpc:
    image: registry.cn-hangzhou.aliyuncs.com/arm64m/frpc:v0.70.1
    container_name: mixspace-mcp-frpc
    restart: unless-stopped
    command: ["-c", "/etc/frp/frpc.toml"]
    depends_on:
      app:
        condition: service_started
    env_file:
      - ./frpc/frpc.env            # FRP_TOKEN=...（不入库）
    volumes:
      - ./frpc/frpc.toml:/etc/frp/frpc.toml:ro
    networks: [mixspace]

networks:
  mixspace:
    driver: bridge